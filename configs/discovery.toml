# Configuration for the scheduled discovery run.
# The simulated volunteers always run. The Claude API reviewer runs only when the
# ANTHROPIC_API_KEY secret is set in the environment. Claude Code CLI reviewers are
# for a local machine with a subscription, not for CI runners.

[run]
name = "discovery"
subject_days = 13.0
min_points = 300
bin_minutes = 10.0
detrend_window_days = 1.0

[search]
min_period = 0.5
fap_trials = 2000     # the feed admits FAP < 0.001: with 2,000 trials that passes at k ≤ 1
fap_stop_after = 1    # stop once 2 trials reach the signal's SNR: it can no longer pass
stellar = "tic"

[aggregate]
cluster_gap_days = 0.05
min_score = 0.5
min_planet_fraction = 0.5

[[reviewers]]
type = "simulated"
id = "volunteer-sensitive"
snr_threshold = 4.5
miss_probability = 0.05
seed = 11

[[reviewers]]
type = "simulated"
id = "volunteer-typical"
snr_threshold = 5.0
miss_probability = 0.10
seed = 12

[[reviewers]]
type = "simulated"
id = "volunteer-cautious"
snr_threshold = 5.5
miss_probability = 0.15
seed = 13

[[reviewers]]
type = "claude"
id = "claude-volunteer-api"
model = "claude-sonnet-5-5"
persona = "volunteer"
