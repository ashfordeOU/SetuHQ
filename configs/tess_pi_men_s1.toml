# Real-data run: TESS SPOC 2-minute light curve of pi Men (TIC 261136679), sector 1.
# Claude reviewers use the Claude Code CLI (Claude team or individual subscription, no API key).
# They run only when `claude` is on PATH and signed in; otherwise the pipeline records them
# as skipped in manifest.json. The API backend is type = "claude" and needs ANTHROPIC_API_KEY.

[run]
name = "tess-pi-men-s1"
subject_days = 13.0
min_points = 300
bin_minutes = 10.0
detrend_window_days = 1.0

[search]
min_period = 0.5
fap_trials = 10000    # block-bootstrap trials: resolves FAPs down to 1e-4 (cached in cache/fap)
stellar = "tic"       # TIC Teff/log g for limb darkening, and ρ★ for the density check

[aggregate]
cluster_gap_days = 0.05
min_score = 0.5
min_planet_fraction = 0.5

[[targets]]
mission = "TESS"
id = "TIC 261136679"
sectors = [1]

[[reviewers]]
type = "simulated"
id = "volunteer-sensitive"
snr_threshold = 4.5
miss_probability = 0.05
seed = 11

[[reviewers]]
type = "simulated"
id = "volunteer-typical"
snr_threshold = 5.0
miss_probability = 0.10
seed = 12

[[reviewers]]
type = "simulated"
id = "volunteer-cautious"
snr_threshold = 5.5
miss_probability = 0.15
seed = 13

[[reviewers]]
type = "claude_code"
id = "claude-volunteer"
persona = "volunteer"

[[reviewers]]
type = "claude_code"
id = "claude-skeptic"
persona = "skeptic"
