# Showcase run: HD 15337 (TIC 120896927), a K dwarf with two known small transiting planets (1.6 and 2.4 Earth radii); the inner one, about 350 ppm deep, is near the detection limit of one sector. TESS SPOC 2-minute sector 4.
# Probes only; Sentinels not run on this example. The three Probes are the deterministic matched-filter
# detectors of configs/tess_pi_men_s1.toml with the same seeds; no AI reviewer is in this configuration, so no
# key or CLI is needed and the manifest records the panel as "probes_only". Reproduce with:
#   setuhq run configs/showcase/tess-hd-15337-s4.toml --out runs/tess-hd-15337-s4
#   setuhq crossmatch runs/tess-hd-15337-s4

[run]
name = "tess-hd-15337-s4"
subject_days = 13.0
min_points = 300
bin_minutes = 10.0
detrend_window_days = 1.0

[search]
min_period = 0.5
fap_trials = 10000    # block-bootstrap trials: resolves FAPs down to 1e-4
fap_cache = "runs/tess-hd-15337-s4/fap_null"  # the null maxima, committed with the run
stellar = "tic"       # TIC Teff/log g for limb darkening, and ρ★ for the density check

[aggregate]
cluster_gap_days = 0.05
min_score = 0.5
min_planet_fraction = 0.5

[[targets]]
mission = "TESS"
id = "TIC 120896927"
sectors = [4]

[[reviewers]]
type = "simulated"
id = "volunteer-sensitive"
snr_threshold = 4.5
miss_probability = 0.05
seed = 11

[[reviewers]]
type = "simulated"
id = "volunteer-typical"
snr_threshold = 5.0
miss_probability = 0.10
seed = 12

[[reviewers]]
type = "simulated"
id = "volunteer-cautious"
snr_threshold = 5.5
miss_probability = 0.15
seed = 13
