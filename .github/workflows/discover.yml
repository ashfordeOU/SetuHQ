name: discover

# Runs one discovery batch every six hours, updates the catalogue and republishes the site.
# Claude's API reviewer runs when the ANTHROPIC_API_KEY repository secret is set.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, linux]
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[tess,claude]"
      - name: Run one discovery batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/exoplan discover configs/discovery.toml --batch-size 20 --time-budget-min 300
      - name: Commit catalogue
        run: |
          git config user.name "ashfordeOU"
          git config user.email "236818772+ashfordeOU@users.noreply.github.com"
          git add docs/discoveries site/discoveries
          git diff --cached --quiet || git commit -m "Discovery batch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
