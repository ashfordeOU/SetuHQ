# SPDX-License-Identifier: AGPL-3.0-only
name: discover

# Runs one discovery batch on request, commits the feed's catalogue and republishes the site.
#
# * Every six hours (schedule, at minute 17 to avoid the top-of-hour rush), and on request (workflow_dispatch).
#   The owner turned the schedule back on after the public release (2026-10-24).
# * Reviewers: the Probes always run. The Claude API Sentinel runs only when the ANTHROPIC_API_KEY repository
#   secret is set; without it the Sentinel is skipped and listed as skipped in the run's manifest, so the batch
#   runs on the Probes only.
# * Every commit it makes is authored and committed as ashfordeOU. Before it commits, it rebuilds every page
#   that embeds the feed's catalogue (the whole site, with the command scripts/ci_local.sh uses; it also replaces
#   the feed page `setuhq discover` writes with a forward to /candidates/) and runs the fast tests. A push made with GITHUB_TOKEN does not start ci.yml, so these checks run here.
# * The feed's admissions are leads for review, not planets: under the pre-registered two-sector rule the
#   feed is still dominated by false alarms (README, Evidence).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[tess,claude,dev]"
      - name: Run one discovery batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/setuhq discover configs/discovery.toml --batch-size 20 --time-budget-min 300
      - name: Rebuild the pages that embed the catalogue
        run: |
          # The same build as scripts/ci_local.sh: the lead run and the worked examples (docs/SHOWCASE.md).
          .venv/bin/setuhq site runs/tess-pi-men-s1 runs/tess-wasp-126-s1 runs/tess-toi-270-s5 runs/tess-hd-15337-s4 runs/tess-toi-236-s2 \
            --catalog docs/discoveries/catalog.json --out site --title "SetuHQ" \
            --validation docs/results/pi_men_validation.md --benchmark docs/results/injection_recovery_simulated_panel.md
      - name: Fast tests before the push
        run: .venv/bin/python -m pytest -q tests/test_discover.py tests/test_codenote.py tests/test_brand.py tests/test_licensing.py tests/test_catalogue.py tests/test_site.py
      - name: Commit catalogue and pages (as ashfordeOU)
        env:
          GIT_AUTHOR_NAME: ashfordeOU
          GIT_AUTHOR_EMAIL: 236818772+ashfordeOU@users.noreply.github.com
          GIT_COMMITTER_NAME: ashfordeOU
          GIT_COMMITTER_EMAIL: 236818772+ashfordeOU@users.noreply.github.com
        run: |
          git add -A docs/discoveries site
          git diff --cached --quiet || git commit -m "Discovery batch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Catalogue planet and star pages (deploy-time, never committed)
        run: PYTHONPATH=src python3 -m setuhq.stubs site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        id: deployment
