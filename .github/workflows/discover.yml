# SPDX-License-Identifier: AGPL-3.0-only
name: discover

# Runs one discovery batch on request, commits the feed's catalogue and republishes the site.
#
# * Manual only (workflow_dispatch). The six-hourly schedule was removed for the public release; turning a
#   schedule back on is the repository owner's decision.
# * Reviewers: the Probes always run. The Claude API Sentinel runs only when the ANTHROPIC_API_KEY repository
#   secret is set; without it the Sentinel is skipped and listed as skipped in the run's manifest, so the batch
#   runs on the Probes only.
# * Every commit it makes is authored and committed as ashfordeOU. Before it commits, it rebuilds every page
#   that embeds the feed's catalogue (the app and its landing page and the plates, with the commands
#   scripts/ci_local.sh uses, and the dashboard; `setuhq discover` writes the feed page itself) and runs the
#   fast tests. A push made with GITHUB_TOKEN does not start ci.yml, so these checks run here.
# * The feed's admissions are leads for review, not planets: under the pre-registered two-sector rule the
#   feed is still dominated by false alarms (README, Evidence).

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[tess,claude,dev]"
      - name: Run one discovery batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/setuhq discover configs/discovery.toml --batch-size 20 --time-budget-min 300
      - name: Rebuild the pages that embed the catalogue
        run: |
          .venv/bin/setuhq app runs/tess-pi-men-s1 --catalog docs/discoveries/catalog.json --out site/app --title "SetuHQ" --landing site/index.html
          .venv/bin/setuhq plate runs/tess-pi-men-s1 --catalog docs/discoveries/catalog.json --out site/plate --title "SetuHQ plates"
          .venv/bin/setuhq dashboard runs/tess-pi-men-s1 --catalog docs/discoveries/catalog.json --out site/dashboard --title "SetuHQ: pi Men (TESS sector 1)"
      - name: Fast tests before the push
        run: .venv/bin/python -m pytest -q tests/test_discover.py tests/test_codenote.py tests/test_brand.py tests/test_licensing.py
      - name: Commit catalogue and pages (as ashfordeOU)
        env:
          GIT_AUTHOR_NAME: ashfordeOU
          GIT_AUTHOR_EMAIL: 236818772+ashfordeOU@users.noreply.github.com
          GIT_COMMITTER_NAME: ashfordeOU
          GIT_COMMITTER_EMAIL: 236818772+ashfordeOU@users.noreply.github.com
        run: |
          git add docs/discoveries site/discoveries site/app site/index.html site/plate site/dashboard
          git diff --cached --quiet || git commit -m "Discovery batch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        id: deployment
