# SPDX-License-Identifier: AGPL-3.0-only
# Publish server.json to the official MCP registry (registry.modelcontextprotocol.io) as
# io.github.ashfordeOU/setuhq. Manual dispatch only, and only after the version is live on PyPI:
# the registry checks that the PyPI package `setuhq` at that version exists and that its
# description carries the ownership marker `mcp-name: io.github.ashfordeOU/setuhq` (README.pypi.md).
#
# Authentication is GitHub OIDC (`mcp-publisher login github-oidc`): the registry grants the
# io.github.ashfordeOU/* namespace to workflows of the ashfordeOU account. No secret, no token.
#
# Dispatch it on the release tag (vX.Y.Z). `dry_run` (on by default) runs every check, including
# the schema validation and the PyPI lookup, and stops before logging in.
name: Publish to the MCP registry

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only: validate server.json and look the version up on PyPI; publish nothing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # GitHub OIDC login to the MCP registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: The ref is a release tag that matches every version surface
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/check_version_sync.py --tag "$GITHUB_REF_NAME"
          elif [ "$DRY" = "true" ]; then
            python3 scripts/check_version_sync.py
          else
            echo "::error::dispatch this on the release tag (vX.Y.Z), not $GITHUB_REF"; exit 1
          fi
      - name: server.json is valid against the registry schema
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "jsonschema==4.26.0"
          python3 - <<'PY'
          import json, jsonschema
          schema = json.load(open("packaging/mcp/server.schema.json"))
          server = json.load(open("server.json"))
          assert server["$schema"] == schema["$id"], (server["$schema"], schema["$id"])
          jsonschema.validators.validator_for(schema)(schema, format_checker=jsonschema.FormatChecker()).validate(server)
          print("server.json is valid against", schema["$id"])
          PY
      - name: PyPI serves this version, with the ownership marker
        run: |
          set -euo pipefail
          ver="$(python3 scripts/check_version_sync.py --print-version)"
          name="$(python3 -c 'import json; print(json.load(open("server.json"))["name"])')"
          curl -fsS "https://pypi.org/pypi/setuhq/${ver}/json" -o pypi.json \
            || { echo "::error::setuhq ${ver} is not on PyPI yet; publish it first (release.yml, publish.yml)"; exit 1; }
          python3 - "$name" <<'PY'
          import json, sys
          desc = json.load(open("pypi.json"))["info"]["description"] or ""
          assert f"mcp-name: {sys.argv[1]}" in desc, "the PyPI description lacks the mcp-name marker"
          print("PyPI description carries mcp-name:", sys.argv[1])
          PY
      - name: Install mcp-publisher (pinned, checksum-verified)
        if: ${{ !inputs.dry_run }}
        # An exact release and its SHA-256, from registry_1.8.1_checksums.txt of
        # modelcontextprotocol/registry: this binary holds the job's OIDC identity. Bump both together.
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - name: Log in (GitHub OIDC) and publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish  # reads ./server.json
