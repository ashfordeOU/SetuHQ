# SPDX-License-Identifier: AGPL-3.0-only
name: pages

# Publishes the committed site/ to GitHub Pages, served at https://setuhq.com (site/CNAME), on every push to
# main, or by hand. site/ is built and committed with scripts/ci_local.sh
# (setuhq site: every page, the report, the plates and the case file); this workflow adds the catalogue's planet
# and star pages (setuhq.stubs) and deploys it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # A small page for every catalogue planet and star the build did not pre-render (~14,000, ~3 KB each), and
      # the sitemaps that list them: written here, before the upload, and never committed. Standard library only.
      - name: Catalogue planet and star pages
        run: PYTHONPATH=src python3 -m setuhq.stubs site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        id: deployment
