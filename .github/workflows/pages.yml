# SPDX-License-Identifier: AGPL-3.0-only
name: pages

# Publishes the committed site/ to GitHub Pages, served at https://setuhq.com (site/CNAME), on every push to
# main and to claude/dreamy-pasteur-pyawgi, or by hand. site/ is built and committed with scripts/ci_local.sh
# (the app, the docket, the plates and the report from the stored run); this workflow deploys it as it is.

on:
  push:
    branches: [main, claude/dreamy-pasteur-pyawgi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
