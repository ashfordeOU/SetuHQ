# SPDX-License-Identifier: AGPL-3.0-only
# Optional: tag a release once main is green on a version bump. OFF by default.
#
# The default flow is manual: the owner tags a commit that is already green on main
# (docs/RELEASING.md). This workflow does that one step for them, and nothing else, once it is
# switched on. When CI (ci.yml) finishes green on a push to main, it reads the version from
# src/setuhq/__init__.py; if no vX.Y.Z tag exists yet, it checks every version surface
# (scripts/check_version_sync.py) and the CHANGELOG section, then pushes an annotated tag on
# exactly the commit CI verified. release.yml then runs on that tag push, unchanged.
#
# It never moves or replaces a tag, and it skips a commit that is no longer main's head.
#
# To switch it on (both are needed; with either missing it does nothing):
#   1. Repository variable AUTO_TAG = true (Settings -> Secrets and variables -> Actions -> Variables).
#   2. Repository secret RELEASE_TAG_TOKEN: a fine-grained token for ashfordeOU/SetuHQ only, with
#      Contents: read and write. A tag pushed with the workflow's own GITHUB_TOKEN does not start
#      other workflows, so release.yml would never run; that is why a separate token is needed.
# With AUTO_TAG on and the secret missing, the job fails, so a bump is never left silently untagged.
name: Auto-tag

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      vars.AUTO_TAG == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The tag token is present
        env:
          TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AUTO_TAG is on but RELEASE_TAG_TOKEN is not set; see docs/RELEASING.md"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - name: Tag the version if it is new
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_version_sync.py --print-version)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "main moved on to $head while CI ran on $SHA; the run on the newer head tags it."
            exit 0
          fi
          python3 scripts/check_version_sync.py --tag "$tag"
          printf '%s\n\nSetuHQ %s. Release notes: CHANGELOG.md, section [%s].\n' "$tag" "$tag" "$version" > "$RUNNER_TEMP/tag-message.txt"
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          git tag -a "$tag" HEAD -F "$RUNNER_TEMP/tag-message.txt"
          git push origin "refs/tags/$tag"
          echo "Pushed $tag on $SHA; release.yml runs on it."
