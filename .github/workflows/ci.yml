name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # the ingest ledger is checked against its merge-base with the base branch, and the README figures name each source's commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"  # the README figures were made with 3.13 and the pins in requirements-readme.txt
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]" -r requirements-readme.txt
      - name: Run tests
        run: .venv/bin/python -m pytest -q
        env:
          CI_REQUIRE_README_CHECK: "1"
      - name: README figures, brand files and screenshots are current
        run: .venv/bin/python tools/gen_readme_assets.py --check
      - name: Sweep catalogue and append-only ingest ledger (a missing base fails here, CI is set)
        run: .venv/bin/setuhq check-sweep --sweep-dir docs/sweep --ledger-base auto

  # The oldest Python the package supports (requires-python >= 3.11): install it and run the fast offline suite,
  # so syntax or library use that needs a newer Python fails here. The README figures are checked on 3.13 above,
  # with their pinned versions; this job installs only ".[dev]".
  test-python-3-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Every tracked Python file compiles on 3.11
        run: git ls-files -z '*.py' | xargs -0 .venv/bin/python -m py_compile
      - name: Run the fast offline tests
        run: .venv/bin/python -m pytest -q
