name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # the ingest ledger is checked against its merge-base with the base branch, and the README figures name each source's commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"  # the README figures were made with 3.13 and the pinned readme extra
      - name: Install into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,readme]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
        env:
          CI_REQUIRE_README_CHECK: "1"
      - name: README figures, brand files and screenshots are current
        run: .venv/bin/python tools/gen_readme_assets.py --check
      - name: Sweep catalogue and append-only ingest ledger (a missing base fails here, CI is set)
        run: .venv/bin/setuhq check-sweep --sweep-dir docs/sweep --ledger-base auto

  site-e2e:
    # The committed site/ (what pages.yml deploys) in Chromium: every page at 1440 x 900 and 390 x 844, dark and
    # light, the top bar, menu, search, history, old addresses, 404, a link crawl and axe-core (scripts/site_e2e.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Playwright and Chromium (the runner's Node.js)
        run: |
          node --version
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end test of site/
        run: scripts/site_e2e.sh site
