# SPDX-License-Identifier: AGPL-3.0-only
# Publish setuhq to PyPI (or TestPyPI) through trusted publishing. There is no token anywhere: the
# publishing job's GitHub OIDC identity is exchanged for a short-lived upload credential, which PyPI
# grants only to this repository, this workflow file (publish.yml) and the `pypi` environment: the
# pending trusted publisher in docs/RELEASING.md. The upload also carries PEP 740 attestations.
#
# Why a workflow of its own, started by the Release run, and not a job inside release.yml: PyPI
# matches a trusted publisher against the TOP-LEVEL workflow of the run, and pypa's action does not
# support publishing from a reusable workflow. So this file is a top-level workflow.
#
# Two ways in:
#
#   1. Automatic: when a Release run (release.yml) for a pushed v* tag completes green. That run has
#      already checked the tag against the version, the changelog and CI on the commit, built and
#      checked the dists, attested them and created the GitHub Release; this workflow downloads the
#      exact dists that run attested (its `dist` artifact) and uploads them. A Release run that failed,
#      was cancelled, or was a manual dispatch (a dry run or a rebuild) publishes nothing.
#   2. A manual dispatch, for a retry or a TestPyPI dry run. It rebuilds the dists from the selected
#      ref. For PyPI the ref must be a v* tag whose Release run passed its `verify` job (read from the
#      Actions API; anything else fails closed). TestPyPI may be dispatched from any ref: it is the dry
#      run, needs its own pending publisher (environment `testpypi`), and is optional.
#
# Re-running after the version is live is a no-op success (skip-existing).
name: Publish to PyPI

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish: testpypi (dry run, any ref) or pypi (a v* tag that passed release.yml verify)"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  dists:
    # Automatic path: only a green Release run of a pushed v* tag in this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # the Release run's artifact, and its verify verdict
    outputs:
      target: ${{ steps.t.outputs.target }}
    steps:
      - id: t
        env:
          TARGET: ${{ inputs.target || 'pypi' }}
        run: echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: The tag still names this commit, and the version is the tag's
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tagged="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          [ -n "$tagged" ] || tagged="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::tag $TAG is at ${tagged:-nothing}, not at the released commit $SHA"; exit 1
          fi
          python3 scripts/check_version_sync.py --tag "$TAG"
      - name: Take the dists the Release run built and attested
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: PyPI from a dispatch needs a v* tag that release.yml verified
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::publishing to PyPI by hand needs a v* tag ref, not $GITHUB_REF"; exit 1
          fi
          python3 scripts/check_version_sync.py --tag "$GITHUB_REF_NAME"
          ok="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
                --jq '.workflow_runs[].id' | while read -r run; do
                  gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs" \
                    --jq '.jobs[] | select(.name == "verify" and .conclusion == "success") | .id'
                done | head -n 1)"
          if [ -z "$ok" ]; then
            echo "::error::no green release.yml verify job for $GITHUB_SHA: push the tag and let release.yml run first"; exit 1
          fi
          echo "release.yml verify passed for $GITHUB_SHA (job $ok)"
      - name: Build the dists (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "build==1.6.1"
          python3 -m build --outdir dist .
      - name: twine check and contents check, on the files about to be uploaded
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "twine==7.0.0"
          python3 -m twine check --strict dist/*
          python3 scripts/check_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-to-publish
          path: dist/
          if-no-files-found: error

  pypi:
    needs: dists
    if: ${{ needs.dists.outputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/setuhq/
    permissions:
      id-token: write  # trusted publishing: the only credential this job has
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-to-publish
          path: dist
      - run: ls -l dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true

  testpypi:
    needs: dists
    if: ${{ needs.dists.outputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/setuhq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-to-publish
          path: dist
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true
