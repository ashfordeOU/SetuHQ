# Smithery (smithery.ai) listing for the SetuHQ MCP server as a LOCAL (stdio) server: Smithery shows the entry
# and the command a client runs on the user's own computer. There is no build or container section on purpose:
# nothing is deployed or hosted for this listing. The pinned version is checked by scripts/check_version_sync.py;
# the steps to list it are in packaging/mcp/SUBMITTING.md. What an assistant finds with it is a candidate, never
# a confirmation.
startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties:
      setuhqRoot:
        type: "string"
        description: "Optional data root (a SetuHQ checkout) for the stored runs, the catalogue and the benchmarks."
  commandFunction: |-
    (config) => ({ "command": "uvx", "args": ["--from", "setuhq[mcp]==0.1.0", "setuhq", "mcp"], "env": config.setuhqRoot ? { "SETUHQ_ROOT": config.setuhqRoot } : {} })
