[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplan"
version = "0.1.0"
description = "Open-source transit search in the style of Planet Hunters CHEOPS, with Claude as a reviewer panel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "matplotlib>=3.7",
    "astroquery>=0.4.7",  # the archive cross-match ('exoplan crossmatch'); the page builds need its result
]

[project.optional-dependencies]
tess = ["lightkurve>=2.4"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "tess-point>=0.9"]  # tess-point: test_galaxy checks pi Men's TESS sectors against it
# scripts/survey_coverage.py: TESS sector pointings and the Kepler/K2 footprint model
survey = ["tess-point>=0.9", "K2fov>=7"]

[project.scripts]
exoplan = "exoplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exoplan = ["fonts/*.css", "fonts/*.txt", "fonts/files/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to MAST or the ESA CHEOPS archive"]
addopts = "-m 'not network'"
