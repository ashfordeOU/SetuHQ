[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setuhq"
# The version is written once, as __version__ in src/setuhq/__init__.py; scripts/check_version_sync.py checks
# every other file that states it (CITATION.cff, codemeta.json, .zenodo.json, server.json, the plugin manifests).
dynamic = ["version"]
description = "SetuHQ, the open exoplanet observatory: a transit search of public TESS data with a calibrated panel of AI Sentinels and deterministic Probes"
# PyPI cannot resolve relative links, so the package page is its own short README with absolute ones.
readme = { file = "README.pypi.md", content-type = "text/markdown" }
license = "AGPL-3.0-only"  # or a commercial licence from Ashforde OÜ: see LICENSING.md
license-files = ["LICENSE", "NOTICE", "LICENSING.md"]
authors = [{ name = "Ashforde OÜ", email = "contact@ashforde.org" }]
requires-python = ">=3.11"  # tomllib (config files) is in the standard library from 3.11
keywords = ["exoplanets", "transit search", "TESS", "benchmark", "citizen science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "matplotlib>=3.7",
    "astroquery>=0.4.7",  # the archive cross-match ('setuhq crossmatch'); the page builds need its result
]

[project.urls]
Homepage = "https://setuhq.com"
Documentation = "https://github.com/ashfordeOU/SetuHQ#readme"
Source = "https://github.com/ashfordeOU/SetuHQ"
Issues = "https://github.com/ashfordeOU/SetuHQ/issues"
Changelog = "https://github.com/ashfordeOU/SetuHQ/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
tess = ["lightkurve>=2.4"]
# Sentinel providers. Claude through the Anthropic API needs its SDK; OpenAI, Gemini and any OpenAI-compatible
# endpoint use plain HTTPS from the standard library, and the Claude Code CLI needs no package: no extra for them.
claude = ["anthropic>=0.40"]
# The MCP server (setuhq-mcp) and the agent example (examples/agents/).
mcp = ["mcp>=1.10"]
agents = ["mcp>=1.10", "claude-agent-sdk>=0.1"]
# tess-point: test_galaxy checks pi Men's TESS sectors; mcp: the server's tests; setuptools and packaging:
# tests/test_release.py generates the real package metadata with the build backend and checks it as check_dist does
dev = ["pytest>=8", "tess-point>=0.9", "mcp>=1.10", "setuptools>=77", "packaging>=24"]
# scripts/survey_coverage.py: TESS sector pointings and the Kepler/K2 footprint model
survey = ["tess-point>=0.9", "K2fov>=7"]
# validate.run_triceratops: statistical validation with TRICERATOPS (Giacalone et al. 2021). Heavy (pytransit, numba,
# celerite) and online-only (it queries the TIC, Gaia and TESSCut itself); the default reduced FPP needs none of it.
validate = ["triceratops>=1.1"]
# The exact versions tools/gen_readme_assets.py needs are in requirements-readme.txt, not here, so the published
# metadata pins nothing exactly.

[project.scripts]
setuhq = "setuhq.cli:main"
setuhq-mcp = "setuhq.mcp_server:main"
# Deprecated aliases from before the rename: each prints a one-line notice on stderr, then runs as above.
exoplan = "setuhq.cli:legacy_main"
exoplan-mcp = "setuhq.mcp_server:legacy_main"

[tool.setuptools.dynamic]
version = { attr = "setuhq.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed: the package ships its type hints (PEP 561). data/: the reference tables the fit and the vetting read,
# byte-identical copies of their docs/results originals (tests/test_release.py checks that they stay so).
setuhq = ["py.typed", "data/*.json", "data/stills/*.webp", "data/stills/*.json", "fonts/*.css", "fonts/*.txt", "fonts/files/*.woff2", "fonts/files/*.woff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to MAST or the ESA CHEOPS archive",
           "slow: long FAP trials; left out of a plain pytest run, run by scripts/ci_local.sh"]
addopts = "-m 'not network and not slow'"
