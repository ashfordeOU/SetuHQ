[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplan"
version = "0.1.0"
description = "Open-source transit search in the style of Planet Hunters CHEOPS, with Claude as a reviewer panel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "matplotlib>=3.7",
    "astroquery>=0.4.7",  # the archive cross-match ('exoplan crossmatch'); the page builds need its result
]

[project.optional-dependencies]
tess = ["lightkurve>=2.4"]
# Sentinel providers. Claude through the Anthropic API needs its SDK; OpenAI, Gemini and any OpenAI-compatible
# endpoint use plain HTTPS from the standard library, and the Claude Code CLI needs no package: no extra for them.
claude = ["anthropic>=0.40"]
# The MCP server (exoplan-mcp) and the agent example (examples/agents/).
mcp = ["mcp>=1.10"]
agents = ["mcp>=1.10", "claude-agent-sdk>=0.1"]
dev = ["pytest>=8", "tess-point>=0.9", "mcp>=1.10"]  # tess-point: test_galaxy checks pi Men's TESS sectors; mcp: the server's tests
# scripts/survey_coverage.py: TESS sector pointings and the Kepler/K2 footprint model
survey = ["tess-point>=0.9", "K2fov>=7"]
# validate.run_triceratops: statistical validation with TRICERATOPS (Giacalone et al. 2021). Heavy (pytransit, numba,
# celerite) and online-only (it queries the TIC, Gaia and TESSCut itself); the default reduced FPP needs none of it.
validate = ["triceratops>=1.1"]

[project.scripts]
exoplan = "exoplan.cli:main"
exoplan-mcp = "exoplan.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exoplan = ["fonts/*.css", "fonts/*.txt", "fonts/files/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to MAST or the ESA CHEOPS archive",
           "slow: long FAP trials; left out of a plain pytest run, run by scripts/ci_local.sh"]
addopts = "-m 'not network and not slow'"
